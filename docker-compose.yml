services:
  db:
    image: postgres:16-alpine
    container_name: creator-growth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: creator
      POSTGRES_PASSWORD: creator
      POSTGRES_DB: creator_growth
    ports:
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creator -d creator_growth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
